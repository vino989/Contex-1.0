services:
  - type: web
    name: cortex-control-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cortex-control-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_SETUP_KEY
        generateValue: true
      - key: PGSSLMODE
        value: require
databases:
  - name: cortex-control-db
    plan: basic-256mb
